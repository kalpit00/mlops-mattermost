            backend:
              service:
                name: kube-prometheus-stack-alertmanager
                port:
                  number: 9093
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-loki
  namespace: observability
  annotations:
{{ toYaml $annotations | indent 4 }}
spec:
  ingressClassName: {{ $className }}
  rules:
    - host: {{ .Values.ingress.hosts.loki | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlops-observability-loki
                port:
                  number: 3100
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-pushgateway
