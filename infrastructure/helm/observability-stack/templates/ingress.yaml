{{- if .Values.ingress.enabled }}
{{- $annotations := .Values.ingress.annotations }}
{{- $className := .Values.ingress.className }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-grafana
  namespace: observability
  annotations:
{{ toYaml $annotations | indent 4 }}
spec:
  ingressClassName: {{ $className }}
  rules:
    - host: {{ .Values.ingress.hosts.grafana | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mlops-observability-grafana
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-prometheus
  namespace: observability
  annotations:
{{ toYaml $annotations | indent 4 }}
spec:
  ingressClassName: {{ $className }}
  rules:
    - host: {{ .Values.ingress.hosts.prometheus | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-prometheus
                port:
                  number: 9090
---
