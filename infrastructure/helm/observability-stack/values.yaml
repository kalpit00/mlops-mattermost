kube-prometheus-stack:
  fullnameOverride: kube-prometheus-stack
  crds:
    enabled: false
  defaultRules:
    create: true
  grafana:
    enabled: true
    admin:
      existingSecret: grafana-admin-secret
      userKey: admin-user
      passwordKey: admin-password
    # MinIO reads credentials live; Grafana only uses GF_SECURITY_ADMIN_* on *first* DB init.
    # Without persistence, the sqlite DB resets on pod recreation and tracks `grafana-admin-secret`.
    persistence:
      enabled: false
    service:
      type: ClusterIP
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
      datasources:
        enabled: true
        defaultDatasourceEnabled: true
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://mlops-observability-loki:3100
        isDefault: false
  prometheus:
    prometheusSpec:
      retention: 7d
      scrapeInterval: 15s
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      ruleSelectorNilUsesHelmValues: false
      ruleNamespaceSelector: {}
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
  alertmanager:
    enabled: true
    alertmanagerSpec:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
  kube-state-metrics:
    enabled: true
  prometheus-node-exporter:
    enabled: true

prometheus-pushgateway:
  fullnameOverride: prometheus-pushgateway
  service:
    type: ClusterIP
  serviceMonitor:
    enabled: true
    namespace: observability
    additionalLabels:
      release: kube-prometheus-stack
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

loki-stack:
  fullnameOverride: observability
  loki:
    enabled: true
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
  promtail:
    enabled: true
    config:
      clients:
        - url: http://mlops-observability-loki:3100/loki/api/v1/push
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  grafana:
    enabled: false
  prometheus:
    enabled: false

ingress:
  enabled: true
  className: nginx
  baseDomain: 129-114-27-105.nip.io
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 256m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/service-upstream: "true"
  hosts:
    grafana: grafana.129-114-27-105.nip.io
    prometheus: prometheus.129-114-27-105.nip.io
    alertmanager: alertmanager.129-114-27-105.nip.io
    loki: loki.129-114-27-105.nip.io
    pushgateway: pushgateway.129-114-27-105.nip.io
