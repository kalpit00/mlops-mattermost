{{- if .Values.training.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.training.name }}
  namespace: {{ .Values.training.namespace }}
spec:
  schedule: {{ .Values.training.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: training
              image: {{ .Values.training.image }}
              imagePullPolicy: {{ .Values.training.imagePullPolicy }}
              command:
                - python
                - -m
                - training.train
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: MLFLOW_TRACKING_URI
                  value: {{ .Values.global.mlflowTrackingUri | quote }}
                - name: TRAIN_CONFIG
                  value: {{ .Values.training.configPath | quote }}
                - name: MLFLOW_MODEL_NAME
                  value: {{ .Values.training.modelName | quote }}
                - name: MIN_FEEDBACK_ROWS
                  value: {{ .Values.training.minFeedbackRows | quote }}
                - name: MLOPS_S3_ENDPOINT
                  value: {{ .Values.global.minioEndpoint | quote }}
                - name: MLOPS_S3_REGION
                  value: {{ .Values.global.s3Region | quote }}
                - name: MLOPS_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.minioSecretName }}
                      key: root-user
                - name: MLOPS_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.minioSecretName }}
                      key: root-password
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.global.s3Region | quote }}
                - name: MLFLOW_S3_ENDPOINT_URL
                  value: {{ .Values.global.minioEndpoint | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.minioSecretName }}
                      key: root-user
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.minioSecretName }}
                      key: root-password
              resources:
{{ toYaml .Values.training.resources | indent 16 }}
{{- end }}
