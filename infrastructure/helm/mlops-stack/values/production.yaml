serving:
  enabled: true
  namespace: mlops-serving
  image: kalpit00/mlops-serving:v3
  modelAlias: production
  servingModelVersion: tfidf-logreg-production
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

servingRay:
  enabled: false
  namespace: mlops-serving
  image: kalpit00/mlops-serving:v5
  imagePullPolicy: Always
  modelAlias: production
  servingModelVersion: tfidf-logreg-production

training:
  enabled: true
  namespace: mlops-training

mattermost:
  enabled: true
  namespace: mattermost
  image: kalpit00/mattermost-mlops:v5
  host: 129-114-27-105.nip.io
  siteUrl: http://129-114-27-105.nip.io
  inferenceUrl: http://ml-serving-ray.mlops-serving.svc.cluster.local:8000

monitoringDashboard:
  enabled: true
  namespace: mlops-serving
  image: kalpit00/mlops-serving:v7
  host: monitoring.129-114-27-105.nip.io

data:
  enabled: true
  namespace: mlops-data
  jupyter:
    enabled: true
    host: data-jupyter.129-114-27-105.nip.io
  pipelines:
    image: kalpit00/mlops-pipelines:v1
    driftMonitor:
      enabled: true
      suspend: false
      syncFromS3: true
      outputDir: /work/data/mlmoderation/monitoring
      uploadPrefix: mlmoderation/monitoring
      pushgatewayUrl: http://prometheus-pushgateway.observability.svc.cluster.local:9091
    datasetBuild:
      enabled: true
      suspend: true
