# Scheduled retraining for TF-IDF + Logistic Regression.
#
# Prereqs:
# - Namespace `mlops-training` exists (see infrastructure/kubernetes/namespaces/mlops-training.yaml)
# - Secret `minio-secret` exists in `mlops-training` (copy from `platform` namespace)
# - Training image is built/pushed and replace `image:` below
# - MLflow is reachable in-cluster at mlflow.platform.svc.cluster.local:5000
#
# Notes:
# - This mirrors the one-shot Job in ../team-stubs/training-stub.yaml, but runs on a schedule.
# - Tune schedule as needed for demos vs cost.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-training-retrain
  namespace: mlops-training
spec:
  # Weekly (class proposal cadence). Change if you want faster demos.
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: training
              image: ghcr.io/example/training:latest
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - training.train
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: MLFLOW_TRACKING_URI
                  value: "http://mlflow.platform.svc.cluster.local:5000"
                - name: TRAIN_CONFIG
                  value: "/app/training/configs/small.yaml"
                - name: MLFLOW_MODEL_NAME
                  value: "tfidf_logreg"
                - name: MLOPS_S3_ENDPOINT
                  value: "http://minio.platform.svc.cluster.local:9000"
                - name: MLOPS_S3_REGION
                  value: "us-east-1"
                - name: MLOPS_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: root-user
                - name: MLOPS_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: root-password
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "4"
                  memory: "8Gi"
