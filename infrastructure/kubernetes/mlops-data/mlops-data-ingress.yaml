# Browser access for the data-plane stack (Compose: minio + jupyter in docker-compose-data.yml).
# Distinct hosts from platform/ (mlflow.*, minio.*) — these target namespace mlops-data only.
# FIP 129.114.25.58 -> 129-114-25-58.nip.io; update when your floating IP changes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlops-data
  namespace: mlops-data
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 256m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/service-upstream: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: "data-jupyter.129-114-25-58.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: data-jupyter
                port:
                  number: 8888
    - host: "data-minio.129-114-25-58.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: data-minio
                port:
                  number: 9001
