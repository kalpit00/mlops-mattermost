# Stub CronJobs for data/pipelines (drift monitor + weekly dataset build).
# Replace the image with one built from the repo Dockerfile.pipelines, and mount a PVC
# at /work that contains the repository tree (or pre-synced artifacts + logs) if you
# are not baking the repo into the image.
#
#   docker build -f Dockerfile.pipelines -t <registry>/mlops-pipelines:latest .
#
# Namespace should match your cluster layout (mlops-data is used elsewhere in this repo).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlops-drift-monitor
  namespace: mlops-data
spec:
  schedule: "15 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pipelines
              image: ghcr.io/example/mlops-pipelines:latest
              imagePullPolicy: IfNotPresent
              workingDir: /work
              args:
                - -m
                - data.pipelines.cli_monitoring
              command:
                - python
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                # Override in your overlay / Secret / ConfigMap:
                - name: MLOPS_MONITOR_REFERENCE_JSON
                  value: ""
                - name: MLOPS_MONITOR_TRAIN_PARQUET
                  value: ""
              resources:
                requests:
                  cpu: "100m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlops-dataset-build
  namespace: mlops-data
spec:
  schedule: "30 8 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pipelines
              image: ghcr.io/example/mlops-pipelines:latest
              imagePullPolicy: IfNotPresent
              workingDir: /work
              args:
                - -m
                - data.pipelines.cli_dataset_build
                - --strict
              command:
                - python
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                requests:
                  cpu: "250m"
                  memory: "1Gi"
                limits:
                  cpu: "4"
                  memory: "8Gi"
