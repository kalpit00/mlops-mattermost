apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mattermost
  namespace: mattermost
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Talk HTTP to Mattermost (avoids nginx trying HTTPS to :8065 → 502)
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Use Service ClusterIP instead of Endpoint pod IPs — fixes "connect() failed (113:
    # Host is unreachable)" when the controller cannot route to the pod network (e.g. hostNetwork ingress).
    nginx.ingress.kubernetes.io/service-upstream: "true"
spec:
  # bootstrap-k8s.sh installs ingress-nginx; public :80 traffic hits nginx, not K3s Traefik
  ingressClassName: nginx
  rules:
    # Kubernetes requires a DNS-style host, not a raw IP. nip.io maps this hostname to your VM:
    #   192.5.87.47  ->  192-5-87-47.nip.io
    # If your floating IP changes, replace dots with dashes and keep .nip.io
    - host: "192-5-87-47.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mattermost
                port:
                  number: 80
