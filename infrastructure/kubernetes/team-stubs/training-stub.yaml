# Training workload derived from:
# - Dockerfile.training (CMD ["python", "train.py"])
# Replace `image:` with the pushed registry image once available.
apiVersion: batch/v1
kind: Job
metadata:
  name: ml-training
  namespace: mlops-training
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: training
          image: ghcr.io/example/training:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - train.py
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "8Gi"
