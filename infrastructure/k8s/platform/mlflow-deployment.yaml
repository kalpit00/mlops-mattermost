# MLflow UI + tracking; metadata SQLite on PVC; artifacts on MinIO bucket mlflow-artifacts.
# Training code: training/train.py (MLFLOW_TRACKING_URI, S3 reads from s3://moderation-data via MLOPS_S3_*).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      initContainers:
        - name: ensure-minio-bucket
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for i in $(seq 1 90); do
                if mc alias set local http://minio.platform.svc.cluster.local:9000 \
                  "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>/dev/null; then
                  break
                fi
                sleep 2
              done
              # mlflow-artifacts: MLflow default artifact root (training.register_model / logged runs)
              # moderation-data: Data pipelines + training seed CSV / feedback paths (training/configs/*.yaml, mattermost sidecar)
              mc mb --ignore-existing local/mlflow-artifacts
              mc mb --ignore-existing local/moderation-data
      containers:
        - name: mlflow
          # Pinned (was previously :latest, which silently floated and drifted
          # the runtime ahead of the SQLite schema, causing INTERNAL_ERROR on
          # the new Runs UI). After bumping this tag in future, run:
          #   kubectl -n platform exec deployment/mlflow -- \
          #     mlflow db upgrade sqlite:////mlflow-data/mlflow.db
          # to migrate the metadata schema before restarting.
          image: ghcr.io/mlflow/mlflow:v3.11.1-full
          ports:
            - name: http
              containerPort: 5000
          env:
            # S3-compatible artifact store (MinIO)
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.platform.svc.cluster.local:9000"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            # DNS rebinding protection: allow Host from nginx Ingress (see platform-ingress.yaml).
            # Use your MLflow hostname(s); * is OK for class demos on a private FIP.
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "*"
            # CORS allowlist for the new MLflow 3.x FastAPI security middleware.
            # Default is `localhost:*`, which silently breaks the Runs UI and the
            # Promote dialog when MLflow is reached via an Ingress hostname (the
            # browser sends `Origin: http://mlflow.<fip>.nip.io` and MLflow's
            # middleware returns 403 with logs like:
            #   "Blocked cross-origin request from http://mlflow...nip.io"
            # `*` is fine for a private demo on a Chameleon FIP. In multi-env,
            # tighten this to a comma-separated allowlist of the actual UI hosts,
            # e.g. "https://mlflow.dev.example.com,https://mlflow.prod.example.com".
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: "*"
          args:
            - mlflow
            - server
            # MLflow 3 defaults to uvicorn with 4 workers; on small pods that OOMs or never binds :5000 in time.
            - --workers
            - "1"
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            # Metadata DB on PVC (durable across pod restarts)
            - --backend-store-uri
            - sqlite:////mlflow-data/mlflow.db
            # Artifacts in MinIO (durable on MinIO PVC)
            - --default-artifact-root
            - s3://mlflow-artifacts/
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "3Gi"
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow-data
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlflow-data-pvc
