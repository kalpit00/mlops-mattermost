# Hyperparameter-sweep run: training/configs/small.yaml
# (smallest vocab — 10k features, unigrams, no class balancing — the
# fastest baseline; useful as the "is the pipeline even working" anchor).
#
# Part of a 4-config sweep. Run all four sequentially via:
#   ./infrastructure/scripts/run-config-sweep.sh
#
# Each Job registers a new version of the `tfidf_logreg` model in MLflow.
# Compare runs in the MLflow UI (experiment `moderation`) to pick the
# winner before wiring it into the retrain CronJob.
apiVersion: batch/v1
kind: Job
metadata:
  name: ml-sweep-small
  namespace: mlops-training
  labels:
    app.kubernetes.io/part-of: mlops-training-sweep
    sweep-config: small
spec:
  backoffLimit: 1
  # Auto-GC the Job 24h after completion so re-runs don't collide on the name.
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: training
          image: kalpit00/mlops-training:v2
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - training.train
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.platform.svc.cluster.local:5000"
            - name: TRAIN_CONFIG
              value: "/app/training/configs/small.yaml"
            - name: MLFLOW_MODEL_NAME
              value: "tfidf_logreg"
            - name: MLOPS_S3_ENDPOINT
              value: "http://minio.platform.svc.cluster.local:9000"
            - name: MLOPS_S3_REGION
              value: "us-east-1"
            - name: MLOPS_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: MLOPS_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.platform.svc.cluster.local:9000"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
