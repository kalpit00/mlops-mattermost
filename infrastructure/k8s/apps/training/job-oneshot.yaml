# One-shot training Job (same image as CronJob).
# Build: `docker build -f Dockerfile.training -t mlops-training:local .` or pull: docker.io/kalpit00/mlops-training:v3
# See: infrastructure/docs/DOCKER-BUILDS.md
#
# - Dockerfile.training, training/train.py, training/configs/*.yaml (S3 under s3://moderation-data/…)
#
# Requires `minio-secret` in namespace mlops-training with the same keys as platform MinIO
# (root-user, root-password). Example: copy from -n platform, or kubectl create ... matching create-secrets.sh
apiVersion: batch/v1
kind: Job
metadata:
  name: ml-training
  namespace: mlops-training
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: training
          image: kalpit00/mlops-training:v3
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - training.train
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # Platform MLflow (in-cluster)
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.platform.svc.cluster.local:5000"
            # Config selection (one of training/configs/*.yaml baked into the image).
            # Pinned to balanced.yaml — the winning config from the Phase A sweep
            # (val_recall 0.88, val_pr_auc 0.873). See `infrastructure/scripts/run-config-sweep.sh`
            # to re-run the comparison.
            - name: TRAIN_CONFIG
              value: "/app/training/configs/balanced.yaml"
            # Min-feedback-rows guard: if the moderator-feedback JSONL has fewer
            # than this many rows, train on Jigsaw seed only (skip feedback).
            # Default 0 here so this Job is liberal — useful for ad-hoc runs
            # against small feedback samples. The CronJob sets this higher.
            - name: MIN_FEEDBACK_ROWS
              value: "0"
            # Optional: register under a friendly model name
            - name: MLFLOW_MODEL_NAME
              value: "tfidf_logreg"
            # MinIO access for downloading seed data / logs (set via Secret in real deployment)
            - name: MLOPS_S3_ENDPOINT
              value: "http://minio.platform.svc.cluster.local:9000"
            # URIs in TRAIN_CONFIG use s3://moderation-data/... (see training/configs/baseline.yaml)
            - name: MLOPS_S3_REGION
              value: "us-east-1"
            - name: MLOPS_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: MLOPS_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.platform.svc.cluster.local:9000"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
