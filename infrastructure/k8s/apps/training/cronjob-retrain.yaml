# Scheduled retraining (TF‑IDF + Logistic Regression).
# Build: `docker build -f Dockerfile.training -t mlops-training:local .` or pull: docker.io/kalpit00/mlops-training:v3
# See: infrastructure/docs/DOCKER-BUILDS.md
#
# Prereqs: namespace, minio-secret, MLflow at mlflow.platform.svc.cluster.local:5000
#
# Notes:
# - This mirrors the one-shot Job in `job-oneshot.yaml`, but runs on a schedule.
# - Pinned to balanced.yaml (winning config from Phase A sweep).
# - Manual smoke run before the schedule kicks in:
#     kubectl -n mlops-training create job \
#       --from=cronjob/ml-training-retrain ml-training-manual-$(date +%s)
# - Promotion is human-in-the-loop: each run produces a new MLflow registered
#   model version. To roll one out, point `MODEL_S3_URI` in serving.yaml at
#   the new run's joblib path and apply + restart the serving Deployment.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-training-retrain
  namespace: mlops-training
spec:
  # Weekly (class proposal cadence). Change if you want faster demos.
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: training
              image: kalpit00/mlops-training:v3
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - training.train
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: MLFLOW_TRACKING_URI
                  value: "http://mlflow.platform.svc.cluster.local:5000"
                # Production-leaning config: highest recall (0.88) on the Phase A
                # sweep, with `class_weight=balanced` to compensate for Jigsaw's
                # class imbalance.
                - name: TRAIN_CONFIG
                  value: "/app/training/configs/balanced.yaml"
                - name: MLFLOW_MODEL_NAME
                  value: "tfidf_logreg"
                # Min-feedback-rows guard: if fewer than this many moderator
                # decisions have accumulated since the last run, retraining
                # falls back to Jigsaw seed only. Set conservatively for the
                # CronJob (vs 0 in job-oneshot.yaml) so we don't let a handful
                # of feedback rows perturb the production model. Tune up over
                # time once feedback volume stabilizes.
                - name: MIN_FEEDBACK_ROWS
                  value: "10"
                - name: MLOPS_S3_ENDPOINT
                  value: "http://minio.platform.svc.cluster.local:9000"
                - name: MLOPS_S3_REGION
                  value: "us-east-1"
                - name: MLOPS_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: root-user
                - name: MLOPS_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: root-password
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"
                - name: MLFLOW_S3_ENDPOINT_URL
                  value: "http://minio.platform.svc.cluster.local:9000"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: root-user
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: root-password
              resources:
                requests:
                  cpu: "200m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
