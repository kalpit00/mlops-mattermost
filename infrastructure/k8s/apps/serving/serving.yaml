# Scoring API: single FastAPI + Uvicorn process (no separate "backend" service).
# Build: `docker build -f Dockerfile.serving -t mlops-serving:local .` or pull: docker.io/kalpit00/mlops-serving:v2
# See infrastructure/docs/DOCKER-BUILDS.md
#
# The initContainer copies MODEL_S3_URI from MinIO; pod stays not-Ready until this path exists.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-serving
  namespace: mlops-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-serving
  template:
    metadata:
      labels:
        app: ml-serving
    spec:
      initContainers:
        - name: fetch-model
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
            # MinIO key from console: mlflow-artifacts/<exp>/<run>/artifacts/tfidf_logreg_pipeline.joblib
            #
            # Pinned to the `balanced_lr_tfidf` run from the 4-config sweep
            # (Phase A, Apr 2026). Selected for highest recall (0.88) and
            # highest val_pr_auc (0.873), which is the right operating point
            # for moderation: false positives are cheap (moderator dismisses
            # in seconds), false negatives are expensive (toxic content stays
            # live). Run_id and metrics are fixed in MLflow; to roll back to
            # the previous run, set this back to run 52fe525e... (small_lr_tfidf).
            - name: MODEL_S3_URI
              value: "platform/mlflow-artifacts/1/6d4935bfbc374b6bbef4362e4e5ef0fb/artifacts/tfidf_logreg_pipeline.joblib"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -z "${MODEL_S3_URI}" ] || [ "${MODEL_S3_URI}" = "REPLACE_ME" ]; then
                echo "MODEL_S3_URI not set; expected a trained pipeline artifact in MinIO."
                exit 1
              fi
              mc alias set platform http://minio.platform.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc cp "${MODEL_S3_URI}" /models/tfidf_logreg_pipeline.joblib
          volumeMounts:
            - name: model
              mountPath: /models
      containers:
        - name: api
          image: kalpit00/mlops-serving:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MODEL_PATH
              value: "/models/tfidf_logreg_pipeline.joblib"
            - name: SERVING_MODEL_VERSION
              value: "tfidf-logreg"
          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: model
              mountPath: /models
      volumes:
        - name: model
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ml-serving
  namespace: mlops-serving
spec:
  selector:
    app: ml-serving
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
