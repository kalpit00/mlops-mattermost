# Scoring API: single FastAPI + Uvicorn process (no separate "backend" service).
# Build: `docker build -f Dockerfile.serving -t mlops-serving:local .` or pull: docker.io/kalpit00/mlops-serving:v2
# See infrastructure/docs/DOCKER-BUILDS.md
#
# Model loading: the initContainer resolves `models:/$MODEL_NAME@$MODEL_ALIAS`
# via MLflow's registry, looks up the underlying run_id, and downloads the
# standalone joblib artifact from MinIO into /models. The pod stays not-Ready
# until that file exists.
#
# Promotion runbook (replaces editing MODEL_S3_URI by hand):
#   1. In MLflow UI, click `Aliases: Add` on the new version (e.g. v8),
#      type `production`, save. Aliases are unique per registered model, so
#      this auto-removes the alias from the previously-promoted version.
#   2. `kubectl -n mlops-serving rollout restart deployment/ml-serving`
#   3. `curl http://<serving>/score -d '{"text":"..."}'` to verify.
# No YAML edits, no git commits — promotion is one click + one kubectl.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-serving
  namespace: mlops-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-serving
  template:
    metadata:
      labels:
        app: ml-serving
    spec:
      initContainers:
        - name: fetch-model
          # MLflow image so we can use the registry client (MlflowClient +
          # mlflow.artifacts.download_artifacts). Already pulled on nodes for
          # the platform/mlflow Deployment, so this is effectively free.
          image: ghcr.io/mlflow/mlflow:v3.11.1-full
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.platform.svc.cluster.local:5000"
            - name: MODEL_NAME
              value: "tfidf_logreg"
            # The alias resolves to whichever model version a moderator marked
            # as `production` in MLflow's UI. Promotion = changing the alias
            # target there; no YAML edit required.
            - name: MODEL_ALIAS
              value: "production"
            # Standalone joblib artifact path inside the run (logged by
            # training/train.py via `mlflow.log_artifact(pipeline_path)`).
            # We deliberately download this rather than the `sk_model/` dir
            # that `register_model` was called on, because the serving app
            # loads via `joblib.load()` from MODEL_PATH and doesn't need the
            # MLflow `sk_model` MLmodel/conda.yaml metadata.
            - name: MODEL_ARTIFACT_PATH
              value: "tfidf_logreg_pipeline.joblib"
            # MinIO credentials for resolving the run's artifact storage.
            # MLflow's tracking server returns the artifact URI as
            # `s3://mlflow-artifacts/...`; the client then talks to MinIO
            # directly using these env vars.
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.platform.svc.cluster.local:9000"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              python <<'PY'
              import os
              from mlflow import MlflowClient
              from mlflow.artifacts import download_artifacts

              name = os.environ["MODEL_NAME"]
              alias = os.environ["MODEL_ALIAS"]
              artifact_path = os.environ["MODEL_ARTIFACT_PATH"]
              dst = "/models"

              client = MlflowClient()
              mv = client.get_model_version_by_alias(name=name, alias=alias)
              print(
                  f"Resolved {name}@{alias} -> version {mv.version}, "
                  f"run_id {mv.run_id}, status {mv.status}"
              )

              download_artifacts(
                  run_id=mv.run_id,
                  artifact_path=artifact_path,
                  dst_path=dst,
              )
              print(f"Downloaded {artifact_path} from run {mv.run_id} to {dst}/")

              # Persist the resolved version so the runtime can surface it in
              # /health or /score responses if app code is later updated to
              # read this file. For now it's diagnostic; harmless if unread.
              with open(f"{dst}/MODEL_VERSION", "w") as f:
                  f.write(f"{name}@{alias}=v{mv.version} (run_id={mv.run_id})\n")
              PY
          volumeMounts:
            - name: model
              mountPath: /models
      containers:
        - name: api
          image: kalpit00/mlops-serving:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MODEL_PATH
              value: "/models/tfidf_logreg_pipeline.joblib"
            - name: SERVING_MODEL_VERSION
              value: "tfidf-logreg"
          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: model
              mountPath: /models
      volumes:
        - name: model
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ml-serving
  namespace: mlops-serving
spec:
  selector:
    app: ml-serving
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
