# Serving workload derived from:
# - Dockerfile.serving
# - Dockerfile.multiworker (uses UVICORN_WORKERS env var)
# Replace `image:` with the pushed registry image once available.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-serving
  namespace: mlops-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-serving
  template:
    metadata:
      labels:
        app: ml-serving
    spec:
      initContainers:
        - name: fetch-model
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
            # MLflow artifact root in this repo is `s3://mlflow-artifacts/` (see `platform/mlflow-deployment.yaml`).
            # Typical pipeline artifact path (from `training/train.py`):
            #   s3://mlflow-artifacts/<experiment_id>/<run_id>/artifacts/outputs/tfidf_logreg_pipeline.joblib
            #
            # If you copy/promote models into another bucket (e.g. `moderation-data/models/...`), use that URI instead.
            - name: MODEL_S3_URI
              value: "REPLACE_ME"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -z "${MODEL_S3_URI}" ] || [ "${MODEL_S3_URI}" = "REPLACE_ME" ]; then
                echo "MODEL_S3_URI not set; expected a trained pipeline artifact in MinIO."
                exit 1
              fi
              mc alias set platform http://minio.platform.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              # mc cp supports s3://bucket/key paths.
              mc cp "${MODEL_S3_URI}" /models/tfidf_logreg_pipeline.joblib
          volumeMounts:
            - name: model
              mountPath: /models
      containers:
        - name: api
          image: ghcr.io/example/serving:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MODEL_PATH
              value: "/models/tfidf_logreg_pipeline.joblib"
            - name: SERVING_MODEL_VERSION
              value: "tfidf-logreg"
          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: model
              mountPath: /models
      volumes:
        - name: model
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ml-serving
  namespace: mlops-serving
spec:
  selector:
    app: ml-serving
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
