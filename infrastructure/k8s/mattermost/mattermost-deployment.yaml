apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
  namespace: mattermost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mattermost
  template:
    metadata:
      labels:
        app: mattermost
    spec:
      containers:
        - name: mattermost
          # NOTE: `MM_MLMODERATION_*` hooks are implemented in *this fork's* server code.
          # Build: `docker build -f server/build/Dockerfile.mlops -t mattermost-mlops:local .` then tag/push, or pull:
          #   docker.io/kalpit00/mattermost-mlops:v1
          # Do not use `server/build/Dockerfile` alone — it downloads upstream binaries and omits local webapp changes.
          image: kalpit00/mattermost-mlops:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8065
          env:
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            - name: MM_SQLSETTINGS_DATASOURCE
              valueFrom:
                secretKeyRef:
                  name: mattermost-app-secret
                  key: datasource
            # Must match Mattermost Ingress host (nip.io encodes the Chameleon floating IP).
            - name: MM_SERVICESETTINGS_SITEURL
              value: "http://129-114-27-105.nip.io"
            - name: MM_SERVICESETTINGS_LISTENADDRESS
              value: ":8065"
            # Plain HTTP behind ingress (empty = no TLS at Mattermost)
            - name: MM_SERVICESETTINGS_CONNECTION_SECURITY
              value: ""
            # Let teammates create accounts (class/demo). Team must still allow joins or use invite link (see README).
            - name: MM_TEAMSETTINGS_ENABLEUSERCREATION
              value: "true"
            - name: MM_TEAMSETTINGS_ENABLEOPENSERVER
              value: "true"
            - name: MM_TEAMSETTINGS_RESTRICTCREATIONTODOMAINS
              value: ""
            - name: MM_SERVICESETTINGS_ENABLESIGNUPWITHEMAIL
              value: "true"
            - name: MM_SERVICESETTINGS_ENABLESIGNINWITHEMAIL
              value: "true"
            - name: MM_SERVICESETTINGS_REQUIREEMAILVERIFICATION
              value: "false"
            # ML moderation logging (writes JSONL under the persistent /mattermost/data mount)
            - name: MM_MLMODERATION_ENABLE_ONLINE_FEATURES
              value: "true"
            - name: MM_MLMODERATION_ENABLE_FEEDBACK_CAPTURE
              value: "true"
            - name: MM_MLMODERATION_LOG_DIR
              value: "/mattermost/data/mlmoderation/logs"
            - name: MM_MLMODERATION_FEEDBACK_LOG_DIR
              value: "/mattermost/data/mlmoderation/feedback"
            # Real model inference (FastAPI serving Deployment in `mlops-serving` namespace).
            # Set after you push a serving image + configure `MODEL_S3_URI` in `k8s/apps/serving/serving.yaml`.
            - name: MM_MLMODERATION_INFERENCE_URL
              value: "http://ml-serving.mlops-serving.svc.cluster.local:8000/score"
            # TF‑IDF + LogReg inference can be slower than the Go default (150ms); give it room on-cluster.
            - name: MM_MLMODERATION_INFERENCE_TIMEOUT_MS
              value: "2000"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: 8065
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: mattermost-data
              mountPath: /mattermost/data
        - name: mlmoderation-log-uploader
          # Sidecar: periodically uploads ML moderation logs from the PVC to platform MinIO.
          # Requires a Secret named `minio-secret` in the `mattermost` namespace with keys:
          # - root-user
          # - root-password
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
            - name: MLOPS_S3_BUCKET
              value: "moderation-data"
            - name: SYNC_INTERVAL_SEC
              value: "60"
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mc alias set platform http://minio.platform.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing "platform/$MLOPS_S3_BUCKET"
              while true; do
                # Mirror logs + feedback (JSONL) into MinIO for training.
                mc mirror --overwrite --remove /mattermost/data/mlmoderation "platform/$MLOPS_S3_BUCKET/mlmoderation" || true
                sleep "$SYNC_INTERVAL_SEC"
              done
          volumeMounts:
            - name: mattermost-data
              mountPath: /mattermost/data
      volumes:
        - name: mattermost-data
          persistentVolumeClaim:
            claimName: mattermost-data-pvc
