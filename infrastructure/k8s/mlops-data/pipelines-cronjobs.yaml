# data.pipelines CLIs in Kubernetes (image must include data/pipelines; see Dockerfile.pipelines).
# Build: docker build -f Dockerfile.pipelines -t mlops-pipelines:local .  (from repo root; needs data/pipelines)
# See: infrastructure/docs/DOCKER-BUILDS.md
#
# start with suspend: true; set suspend: false when image + S3 env are ready
#
# S3 targets the shared platform MinIO (namespace platform, Service minio). Requires `minio-secret`
# in this namespace with the same root-user/root-password as platform (see create-mlops-data-secrets.sh).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlops-drift-monitor
  namespace: mlops-data
spec:
  suspend: true
  schedule: "15 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pipelines
              image: mlops-pipelines:local
              imagePullPolicy: IfNotPresent
              workingDir: /work
              command: ["python"]
              args:
                - -m
                - data.pipelines.cli_monitoring
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: MLOPS_SKIP_S3_UPLOAD
                  value: "0"
                - name: MLOPS_LOCAL_ARTIFACTS_ROOT
                  value: "/work/data/artifacts"
                - name: MLOPS_S3_ENDPOINT
                  value: "http://minio.platform.svc.cluster.local:9000"
                - name: MLOPS_S3_BUCKET
                  value: "moderation-data"
                - name: MLOPS_S3_REGION
                  value: "us-east-1"
                - name: MLOPS_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: root-user
                - name: MLOPS_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: root-password
                - name: MLOPS_MONITOR_REFERENCE_JSON
                  value: ""
                - name: MLOPS_MONITOR_TRAIN_PARQUET
                  value: ""
              volumeMounts:
                - name: scratch
                  mountPath: /work/data/artifacts
              resources:
                requests:
                  cpu: "100m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "4Gi"
          volumes:
            - name: scratch
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlops-dataset-build
  namespace: mlops-data
spec:
  suspend: true
  schedule: "30 8 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pipelines
              image: mlops-pipelines:local
              imagePullPolicy: IfNotPresent
              workingDir: /work
              command: ["python"]
              args:
                - -m
                - data.pipelines.cli_dataset_build
                - --strict
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: MLOPS_SKIP_S3_UPLOAD
                  value: "0"
                - name: MLOPS_LOCAL_ARTIFACTS_ROOT
                  value: "/work/data/artifacts"
                - name: MLOPS_S3_ENDPOINT
                  value: "http://minio.platform.svc.cluster.local:9000"
                - name: MLOPS_S3_BUCKET
                  value: "moderation-data"
                - name: MLOPS_S3_REGION
                  value: "us-east-1"
                - name: MLOPS_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: root-user
                - name: MLOPS_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: root-password
              volumeMounts:
                - name: scratch
                  mountPath: /work/data/artifacts
              resources:
                requests:
                  cpu: "250m"
                  memory: "1Gi"
                limits:
                  cpu: "4"
                  memory: "8Gi"
          volumes:
            - name: scratch
              emptyDir: {}
