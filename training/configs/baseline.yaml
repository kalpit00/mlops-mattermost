experiment_name: moderation
run_name: baseline_lr_tfidf

seed: 42
threshold: 0.5

data:
  seed_csv_s3_uri: "s3://moderation-data/raw/jigsaw/train.csv"
  seed_csv_local_path: "" # e.g. /data/train.csv
  text_column: comment_text
  label_column: toxic

feedback:
  # Optional: incorporate Mattermost moderation feedback by joining features+feedback logs.
  features_jsonl_s3_uri: "" # e.g. s3://moderation-data/mlmoderation/logs/online_features_v1.jsonl
  feedback_jsonl_s3_uri: "" # e.g. s3://moderation-data/mlmoderation/feedback/moderation_feedback_v1.jsonl
  max_rows: 50000

model:
  vectorizer: tfidf
  max_features: 20000
  ngram_range: [1, 1]
  min_df: 2
  estimator: logreg
  C: 1.0
  class_weight: null
  max_iter: 1000

runtime:
  n_jobs: -1

gates:
  # Minimal quality gate for promotion (tune as you gather in-domain labels).
  min_val_roc_auc: 0.95
  min_val_recall: 0.55
